<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频生成弹窗 - EmotionVoice</title>
    <style>
        :root {
            --bg-primary: #0E0F12;
            --bg-secondary: #15171B;
            --bg-tertiary: #1C1F24;
            --bg-elevated: #22262D;
            --accent-primary: #E8A968;
            --accent-secondary: #D49B5B;
            --accent-glow: #F2C088;
            --text-primary: #F5F5F7;
            --text-secondary: #A8ABB4;
            --text-tertiary: #6B6E76;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-medium: rgba(255, 255, 255, 0.15);
            --success: #4ADE80;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
            background: linear-gradient(135deg, #0E0F12 0%, #15171B 50%, #0E0F12 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* Demo background to simulate app context */
        .demo-context {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: -1;
        }

        /* ===== MODAL OVERLAY ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 1;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== MODAL CONTAINER ===== */
        .modal {
            width: 100%;
            max-width: 520px;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            box-shadow: 
                0 0 0 0.5px rgba(255,255,255,0.08),
                0 24px 80px rgba(0,0,0,0.6),
                0 8px 24px rgba(0,0,0,0.4),
                0 0 60px rgba(232, 169, 104, 0.08);
            overflow: hidden;
            animation: modalSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ===== MODAL HEADER ===== */
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(21, 23, 27, 0.6);
        }

        .modal-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-title-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .modal-close {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        /* ===== MODAL BODY ===== */
        .modal-body {
            padding: 24px 20px;
        }

        /* ===== GENERATING STATE ===== */
        .generating-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .generating-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(232, 169, 104, 0.15), rgba(232, 169, 104, 0.05));
            border: 1px solid rgba(232, 169, 104, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
        }

        .generating-icon::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--accent-primary);
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .generating-icon-inner {
            font-size: 28px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .generating-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .generating-subtitle {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-bottom: 24px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            margin-bottom: 16px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .progress-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .progress-value {
            font-size: 12px;
            color: var(--accent-primary);
            font-family: 'SF Mono', 'Monaco', monospace;
            font-weight: 600;
        }

        .progress-track {
            height: 6px;
            background: var(--bg-elevated);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 35%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-glow));
            border-radius: 3px;
            position: relative;
            transition: width 0.5s ease;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: var(--accent-glow);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(232, 169, 104, 0.6);
        }

        /* Wave Animation */
        .wave-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 40px;
            margin-top: 20px;
        }

        .wave-bar {
            width: 4px;
            background: linear-gradient(to top, var(--accent-primary), var(--accent-glow));
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { animation-delay: 0s; height: 12px; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 24px; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 32px; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 20px; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 28px; }
        .wave-bar:nth-child(6) { animation-delay: 0.3s; height: 16px; }
        .wave-bar:nth-child(7) { animation-delay: 0.2s; height: 36px; }
        .wave-bar:nth-child(8) { animation-delay: 0.1s; height: 22px; }
        .wave-bar:nth-child(9) { animation-delay: 0s; height: 14px; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1); }
        }

        .generating-hint {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== COMPLETED STATE ===== */
        .completed-state {
            display: none;
        }

        .completed-state.active {
            display: block;
        }

        .generating-state.hidden {
            display: none;
        }

        /* Audio Info */
        .audio-info {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-md);
            margin-bottom: 20px;
        }

        .audio-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--bg-primary);
            flex-shrink: 0;
        }

        .audio-details {
            flex: 1;
            min-width: 0;
        }

        .audio-name-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .audio-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .audio-name-input {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            background: var(--bg-elevated);
            border: 1px solid var(--border-medium);
            border-radius: 4px;
            padding: 2px 8px;
            outline: none;
            width: 180px;
            font-family: inherit;
        }

        .audio-name-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(232, 169, 104, 0.15);
        }

        .audio-edit-btn {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .audio-edit-btn:hover {
            background: var(--bg-elevated);
            color: var(--text-secondary);
        }

        .audio-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .audio-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Audio Player */
        .audio-player {
            background: var(--bg-tertiary);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 16px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .play-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(232, 169, 104, 0.3);
        }

        .play-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(232, 169, 104, 0.4);
        }

        .play-button:active {
            transform: scale(0.98);
        }

        .play-button svg {
            width: 20px;
            height: 20px;
            fill: var(--bg-primary);
            margin-left: 2px;
        }

        .play-button.playing svg {
            margin-left: 0;
        }

        .player-waveform {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 2px;
            height: 48px;
        }

        .waveform-bar {
            width: 3px;
            background: var(--bg-elevated);
            border-radius: 1.5px;
            transition: all 0.3s ease;
        }

        .waveform-bar.active {
            background: var(--accent-primary);
        }

        .player-time {
            font-size: 12px;
            color: var(--text-tertiary);
            font-family: 'SF Mono', 'Monaco', monospace;
            flex-shrink: 0;
            min-width: 85px;
            text-align: right;
        }

        .player-progress {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-progress-track {
            flex: 1;
            height: 4px;
            background: var(--bg-elevated);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .player-progress-fill {
            height: 100%;
            width: 35%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-glow));
            border-radius: 2px;
            position: relative;
        }

        .player-progress-thumb {
            position: absolute;
            right: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: var(--accent-glow);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(232, 169, 104, 0.5);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .player-progress-track:hover .player-progress-thumb {
            opacity: 1;
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: var(--bg-elevated);
            border-color: var(--border-medium);
            transform: translateY(-1px);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .action-btn:hover .action-btn-icon {
            background: var(--accent-primary);
        }

        .action-btn:hover .action-btn-icon svg {
            stroke: var(--bg-primary);
        }

        .action-btn-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .action-btn:hover .action-btn-label {
            color: var(--text-primary);
        }

        /* Voice Info */
        .voice-info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-md);
            margin-bottom: 16px;
        }

        .voice-avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--bg-primary);
            flex-shrink: 0;
        }

        .voice-info-content {
            flex: 1;
            min-width: 0;
        }

        .voice-info-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .voice-info-meta {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .voice-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            background: rgba(232, 169, 104, 0.15);
            color: var(--accent-glow);
        }

        /* Tags */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .tag {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        .tag.accent {
            background: rgba(232, 169, 104, 0.12);
            color: var(--accent-glow);
            border-color: rgba(232, 169, 104, 0.25);
        }

        /* Cost Info */
        .cost-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: linear-gradient(135deg, rgba(232, 169, 104, 0.08), rgba(232, 169, 104, 0.02));
            border: 1px solid rgba(232, 169, 104, 0.15);
            border-radius: var(--radius-md);
            margin-bottom: 16px;
        }

        .cost-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cost-icon {
            font-size: 14px;
        }

        .cost-label {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .cost-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-primary);
            font-family: 'SF Mono', 'Monaco', monospace;
        }

        /* ===== MODAL FOOTER ===== */
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 16px 20px;
            border-top: 1px solid var(--border-subtle);
            background: rgba(21, 23, 27, 0.4);
        }

        .btn {
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-medium);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-tertiary);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            color: var(--bg-primary);
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(232, 169, 104, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(232, 169, 104, 0.35);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Success Animation */
        .success-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            box-shadow: 0 2px 8px rgba(74, 222, 128, 0.4);
            animation: successPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes successPop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        /* Edit Mode Indicator */
        .editing-indicator {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--accent-primary);
        }

        .editing-indicator.active {
            display: flex;
        }

        .save-indicator {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        /* Demo Switcher */
        .demo-switcher {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 6px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .demo-switch-btn {
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 500;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .demo-switch-btn:hover {
            color: var(--text-primary);
        }

        .demo-switch-btn.active {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        /* Download Progress Overlay */
        .download-overlay {
            position: absolute;
            inset: 0;
            background: rgba(14, 15, 18, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            flex-direction: column;
            gap: 12px;
        }

        .download-overlay.active {
            display: flex;
        }

        .download-text {
            font-size: 13px;
            color: var(--text-primary);
        }

        .download-progress {
            width: 120px;
            height: 4px;
            background: var(--bg-elevated);
            border-radius: 2px;
            overflow: hidden;
        }

        .download-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-primary);
            animation: downloadProgress 2s ease-in-out forwards;
        }

        @keyframes downloadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="demo-context"></div>

    <!-- Modal Overlay -->
    <div class="modal-overlay">
        <div class="modal">
            <!-- Header -->
            <div class="modal-header">
                <div class="modal-title">
                    <div class="modal-title-icon">🎵</div>
                    <span id="modalTitle">音频生成</span>
                </div>
                <button class="modal-close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Body -->
            <div class="modal-body">
                <!-- Generating State -->
                <div class="generating-state" id="generatingState">
                    <div class="generating-icon">
                        <span class="generating-icon-inner">⚡</span>
                    </div>
                    <h3 class="generating-title">正在合成音频</h3>
                    <p class="generating-subtitle">龙安灵心 · 中文普通话 · 情感标签 3 个</p>
                    
                    <div class="progress-container">
                        <div class="progress-header">
                            <span class="progress-label">生成进度</span>
                            <span class="progress-value" id="progressValue">35%</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" id="progressFill" style="width: 35%;"></div>
                        </div>
                    </div>

                    <div class="wave-container">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>

                    <div class="generating-hint">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span>预计剩余时间约 8 秒</span>
                    </div>
                </div>

                <!-- Completed State -->
                <div class="completed-state" id="completedState">
                    <!-- Audio Info with Editable Name -->
                    <div class="audio-info">
                        <div class="audio-avatar" style="position: relative;">
                            🎵
                            <div class="success-badge">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                        </div>
                        <div class="audio-details">
                            <div class="audio-name-container">
                                <span class="audio-name" id="audioNameDisplay">有声书·第一章_片段</span>
                                <input type="text" class="audio-name-input" id="audioNameInput" value="有声书·第一章_片段" style="display: none;">
                                <button class="audio-edit-btn" id="editNameBtn" title="编辑名称">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="audio-meta">
                                <span class="audio-meta-item">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                                    </svg>
                                    <span>28 积分</span>
                                </span>
                                <span class="audio-meta-item">·</span>
                                <span class="audio-meta-item">48 kHz</span>
                                <span class="audio-meta-item">·</span>
                                <span class="audio-meta-item">WAV</span>
                            </div>
                        </div>
                    </div>

                    <!-- Audio Player -->
                    <div class="audio-player">
                        <div class="player-controls">
                            <button class="play-button" id="playButton">
                                <svg id="playIcon" viewBox="0 0 24 24">
                                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                </svg>
                                <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
                                    <rect x="6" y="4" width="4" height="16"></rect>
                                    <rect x="14" y="4" width="4" height="16"></rect>
                                </svg>
                            </button>
                            <div class="player-waveform" id="waveform">
                                <!-- Waveform bars will be generated by JS -->
                            </div>
                            <div class="player-time">
                                <span id="currentTime">0:00</span>
                                <span> / </span>
                                <span id="totalTime">2:34</span>
                            </div>
                        </div>
                        <div class="player-progress">
                            <div class="player-progress-track">
                                <div class="player-progress-fill" id="playerProgressFill">
                                    <div class="player-progress-thumb"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <button class="action-btn" id="downloadBtn">
                            <div class="action-btn-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                            </div>
                            <span class="action-btn-label">导出</span>
                            <div class="download-overlay" id="downloadOverlay">
                                <span class="download-text">导出中...</span>
                                <div class="download-progress">
                                    <div class="download-progress-fill"></div>
                                </div>
                            </div>
                        </button>
                        <button class="action-btn" id="copyBtn">
                            <div class="action-btn-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </div>
                            <span class="action-btn-label">复制</span>
                        </button>
                        <button class="action-btn" id="shareBtn">
                            <div class="action-btn-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="18" cy="5" r="3"></circle>
                                    <circle cx="6" cy="12" r="3"></circle>
                                    <circle cx="18" cy="19" r="3"></circle>
                                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                                </svg>
                            </div>
                            <span class="action-btn-label">分享</span>
                        </button>
                    </div>

                    <!-- Voice Info -->
                    <div class="voice-info-row">
                        <div class="voice-avatar-small">灵</div>
                        <div class="voice-info-content">
                            <div class="voice-info-name">龙安灵心 · 旗舰音色</div>
                            <div class="voice-info-meta">女声 · 25岁 · 中文普通话</div>
                        </div>
                        <span class="voice-badge">推荐</span>
                    </div>

                    <!-- Tags -->
                    <div class="tags-container">
                        <span class="tag accent">有声书</span>
                        <span class="tag">温暖</span>
                        <span class="tag">自然</span>
                        <span class="tag">清晰</span>
                    </div>

                    <!-- Cost Info -->
                    <div class="cost-info">
                        <div class="cost-item">
                            <span class="cost-icon">💎</span>
                            <span class="cost-label">消耗积分</span>
                        </div>
                        <span class="cost-value">28</span>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelBtn">
                    取消
                </button>
                <button class="btn btn-primary" id="doneBtn" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    完成
                </button>
            </div>
        </div>
    </div>

    <!-- Demo Switcher -->
    <div class="demo-switcher">
        <button class="demo-switch-btn active" data-state="generating">生成中</button>
        <button class="demo-switch-btn" data-state="completed">已完成</button>
    </div>

    <script>
        // Generate waveform bars
        const waveformContainer = document.getElementById('waveform');
        for (let i = 0; i < 60; i++) {
            const bar = document.createElement('div');
            bar.className = 'waveform-bar';
            const height = Math.random() * 32 + 8;
            bar.style.height = `${height}px`;
            if (i < 21) bar.classList.add('active');
            waveformContainer.appendChild(bar);
        }

        // Demo state switcher
        const generatingState = document.getElementById('generatingState');
        const completedState = document.getElementById('completedState');
        const modalTitle = document.getElementById('modalTitle');
        const doneBtn = document.getElementById('doneBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const switchBtns = document.querySelectorAll('.demo-switch-btn');

        // Progress simulation
        let progress = 35;
        const progressFill = document.getElementById('progressFill');
        const progressValue = document.getElementById('progressValue');

        function updateProgress() {
            if (progress < 100) {
                progress += Math.random() * 8 + 3;
                if (progress > 100) progress = 100;
                progressFill.style.width = `${progress}%`;
                progressValue.textContent = `${Math.round(progress)}%`;
                setTimeout(updateProgress, 400);
            } else {
                // Switch to completed state
                setTimeout(() => {
                    generatingState.classList.add('hidden');
                    completedState.classList.add('active');
                    modalTitle.textContent = '生成完成';
                    doneBtn.style.display = 'flex';
                    cancelBtn.textContent = '关闭';
                }, 500);
            }
        }

        // Start progress simulation on load
        setTimeout(updateProgress, 500);

        // State switcher
        switchBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                switchBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                if (btn.dataset.state === 'completed') {
                    progress = 100;
                    generatingState.classList.add('hidden');
                    completedState.classList.add('active');
                    modalTitle.textContent = '生成完成';
                    doneBtn.style.display = 'flex';
                    cancelBtn.textContent = '关闭';
                    progressFill.style.width = '100%';
                    progressValue.textContent = '100%';
                } else {
                    progress = 35;
                    generatingState.classList.remove('hidden');
                    completedState.classList.remove('active');
                    modalTitle.textContent = '音频生成';
                    doneBtn.style.display = 'none';
                    cancelBtn.textContent = '取消';
                    progressFill.style.width = '35%';
                    progressValue.textContent = '35%';
                    setTimeout(updateProgress, 500);
                }
            });
        });

        // Play button
        const playButton = document.getElementById('playButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const currentTimeEl = document.getElementById('currentTime');
        const playerProgressFill = document.getElementById('playerProgressFill');
        let isPlaying = false;
        let currentTime = 0;
        const totalSeconds = 154; // 2:34

        playButton.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playButton.classList.toggle('playing', isPlaying);
            playIcon.style.display = isPlaying ? 'none' : 'block';
            pauseIcon.style.display = isPlaying ? 'block' : 'none';

            if (isPlaying) {
                playInterval = setInterval(() => {
                    currentTime++;
                    if (currentTime >= totalSeconds) {
                        currentTime = 0;
                        isPlaying = false;
                        playButton.classList.remove('playing');
                        playIcon.style.display = 'block';
                        pauseIcon.style.display = 'none';
                        clearInterval(playInterval);
                    }
                    updatePlayerUI();
                }, 1000);
            } else {
                clearInterval(playInterval);
            }
        });

        function updatePlayerUI() {
            const mins = Math.floor(currentTime / 60);
            const secs = currentTime % 60;
            currentTimeEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            const progress = (currentTime / totalSeconds) * 100;
            playerProgressFill.style.width = `${progress}%`;

            // Update waveform
            const bars = waveformContainer.querySelectorAll('.waveform-bar');
            bars.forEach((bar, i) => {
                const barProgress = (i / bars.length) * 100;
                bar.classList.toggle('active', barProgress <= progress);
            });
        }

        // Edit name functionality
        const editNameBtn = document.getElementById('editNameBtn');
        const audioNameDisplay = document.getElementById('audioNameDisplay');
        const audioNameInput = document.getElementById('audioNameInput');

        editNameBtn.addEventListener('click', () => {
            if (audioNameInput.style.display === 'none') {
                audioNameInput.style.display = 'block';
                audioNameDisplay.style.display = 'none';
                audioNameInput.focus();
                audioNameInput.select();
            } else {
                audioNameInput.style.display = 'none';
                audioNameDisplay.style.display = 'inline';
            }
        });

        audioNameInput.addEventListener('blur', () => {
            const newName = audioNameInput.value.trim() || '未命名音频';
            audioNameInput.value = newName;
            audioNameDisplay.textContent = newName;
            audioNameInput.style.display = 'none';
            audioNameDisplay.style.display = 'inline';
        });

        audioNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                audioNameInput.blur();
            }
            if (e.key === 'Escape') {
                audioNameInput.value = audioNameDisplay.textContent;
                audioNameInput.blur();
            }
        });

        // Download button
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadOverlay = document.getElementById('downloadOverlay');

        downloadBtn.addEventListener('click', () => {
            downloadOverlay.classList.add('active');
            setTimeout(() => {
                downloadOverlay.classList.remove('active');
            }, 2000);
        });

        // Copy button
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.addEventListener('click', () => {
            const originalText = copyBtn.querySelector('.action-btn-label').textContent;
            copyBtn.querySelector('.action-btn-label').textContent = '已复制!';
            setTimeout(() => {
                copyBtn.querySelector('.action-btn-label').textContent = originalText;
            }, 1500);
        });

        // Close modal demo
        document.querySelector('.modal-close').addEventListener('click', () => {
            document.querySelector('.modal-overlay').style.display = 'none';
        });

        cancelBtn.addEventListener('click', () => {
            document.querySelector('.modal-overlay').style.display = 'none';
        });

        doneBtn.addEventListener('click', () => {
            document.querySelector('.modal-overlay').style.display = 'none';
        });
    </script>
</body>
</html>
