<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频播放 · 字级时间戳对齐 - EmotionVoice</title>
<style>
    :root {
        --bg-primary: #0E0F12;
        --bg-secondary: #15171B;
        --bg-tertiary: #1C1F24;
        --bg-elevated: #22262D;
        --bg-hover: rgba(255, 255, 255, 0.06);

        --accent-primary: #E8A968;
        --accent-secondary: #D49B5B;
        --accent-glow: #F2C088;
        --accent-dim: rgba(232, 169, 104, 0.14);
        --accent-line: rgba(232, 169, 104, 0.34);
        --accent-wash: rgba(232, 169, 104, 0.10);

        --text-primary: #F5F5F7;
        --text-secondary: #A8ABB4;
        --text-tertiary: #6B6E76;
        --text-quaternary: #8A8E97;   /* 弱化正文：对 #15171B 约 5.5:1，满足 WCAG AA */
        --text-timecode: #9296A0;    /* 时间码专用：对 #15171B 约 6:1，满足 WCAG AA */

        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-medium: rgba(255, 255, 255, 0.16);

        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --radius-pill: 999px;

        --titlebar-height: 52px;
        --gutter-width: 62px;

        --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
        --font-mono: ui-monospace, 'SF Mono', 'Menlo', 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
        font-family: var(--font-sans);
        background: #08090B;
        color: var(--text-primary);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    /* ============ Window ============ */
    .macos-window {
        width: 100%;
        max-width: 880px;
        height: 880px;
        max-height: calc(100vh - 48px);
        display: flex;
        flex-direction: column;
        background: var(--bg-primary);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-xl);
        overflow: hidden;
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.62);
    }

    /* ============ Title Bar ============ */
    .titlebar {
        height: var(--titlebar-height);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 0 16px;
        background: linear-gradient(180deg, rgba(32, 34, 40, 0.96), rgba(20, 22, 26, 0.92));
        border-bottom: 1px solid var(--border-subtle);
        position: relative;
    }

    .traffic-lights { display: flex; gap: 8px; z-index: 1; }
    .traffic-light { width: 12px; height: 12px; border-radius: 50%; }
    .traffic-light.close { background: #FF453A; }
    .traffic-light.minimize { background: #FFD60A; }
    .traffic-light.zoom { background: #30D158; }

    .titlebar-title {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        letter-spacing: 0.01em;
    }

    /* ============ Body ============ */
    .app-body { flex: 1; display: flex; overflow: hidden; }

    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background:
            radial-gradient(760px 340px at 50% -8%, rgba(232, 169, 104, 0.07), transparent 70%),
            var(--bg-primary);
    }

    .content-toolbar {
        height: 48px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 22px;
        border-bottom: 1px solid var(--border-subtle);
    }
    .toolbar-actions { margin-left: auto; display: flex; gap: 8px; }

    .ghost-btn {
        height: 30px;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-tertiary);
        color: var(--text-secondary);
        border-radius: var(--radius-md);
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s ease;
    }
    .ghost-btn:hover { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--border-medium); }
    .ghost-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .ghost-btn:focus-visible, .skip-btn:focus-visible, .play-btn:focus-visible,
    .speed-trigger:focus-visible, .time-total:focus-visible, .follow-toggle:focus-visible,
    .recenter:focus-visible {
        outline: 2px solid var(--accent-primary);
        outline-offset: 2px;
    }

    .player-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 20px 22px 22px;
    }
    .player-scroll::-webkit-scrollbar { width: 10px; }
    .player-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }

    .player-inner { max-width: 760px; margin: 0 auto; }

    /* ============ Meta strip ============ */
    .meta-strip {
        display: flex;
        align-items: stretch;
        gap: 10px;
        flex-wrap: wrap;
    }

    .meta-cell {
        flex: 1;
        min-width: 132px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        padding: 11px 14px;
    }
    .meta-cell.accent {
        background: linear-gradient(180deg, rgba(232, 169, 104, 0.14), rgba(232, 169, 104, 0.05));
        border-color: var(--accent-line);
    }
    .meta-key {
        font-size: 11px;
        color: var(--text-tertiary);
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .meta-key svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .meta-val {
        font-family: var(--font-mono);
        font-size: 17px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: -0.01em;
        margin-top: 3px;
    }
    .meta-cell.accent .meta-val { color: var(--accent-glow); }
    .meta-val .unit { font-size: 11px; font-weight: 400; color: var(--text-tertiary); margin-left: 3px; font-family: var(--font-sans); }
    .meta-sub { font-size: 10.5px; color: var(--text-tertiary); margin-top: 2px; font-family: var(--font-mono); }

    /* ============ Waveform ============ */
    .wave-section { margin-top: 18px; }

    .wave-hit {
        position: relative;
        padding: 16px 0 8px;
        cursor: pointer;
        touch-action: none;
        user-select: none;
    }

    .sentence-ticks {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 12px;
    }
    .tick {
        position: absolute;
        top: 2px;
        width: 2px;
        height: 8px;
        margin-left: -1px;
        border-radius: 2px;
        background: var(--accent-line);
        cursor: pointer;
        transition: background-color 0.12s ease, height 0.12s ease;
    }
    .tick::before { content: ''; position: absolute; inset: -8px -6px; }
    .tick:hover, .tick.current { background: var(--accent-glow); height: 11px; top: 0; }
    .sentence-ticks.off { display: none; }

    .waveform {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 84px;
    }
    .wave-bar {
        flex: 1;
        min-width: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.13);
        transition: background-color 0.12s linear, transform 0.12s ease;
    }
    .wave-bar.played { background: linear-gradient(180deg, var(--accent-glow), var(--accent-secondary)); }
    .wave-hit:hover .wave-bar { background: rgba(255, 255, 255, 0.2); }
    .wave-hit:hover .wave-bar.played { background: linear-gradient(180deg, var(--accent-glow), var(--accent-secondary)); }

    .playhead {
        position: absolute;
        top: 12px;
        bottom: 4px;
        width: 2px;
        margin-left: -1px;
        background: var(--accent-primary);
        border-radius: 2px;
        pointer-events: none;
        box-shadow: 0 0 10px rgba(232, 169, 104, 0.55);
        z-index: 1;
    }
    .playhead::after {
        content: '';
        position: absolute;
        top: -4px;
        left: 50%;
        transform: translateX(-50%);
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent-primary);
        box-shadow: 0 0 0 3px rgba(232, 169, 104, 0.18);
    }

    .hover-bubble {
        position: absolute;
        top: -10px;
        transform: translateX(-50%);
        padding: 3px 7px;
        border-radius: var(--radius-sm);
        background: var(--bg-elevated);
        border: 1px solid var(--border-medium);
        color: var(--text-primary);
        font-family: var(--font-mono);
        font-size: 11px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.12s ease;
        white-space: nowrap;
        z-index: 3;
    }
    .wave-hit:hover .hover-bubble { opacity: 1; }

    .time-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 4px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-tertiary);
    }
    .time-row .cur { color: var(--text-secondary); min-width: 58px; }
    .active-range {
        flex: 1;
        text-align: center;
        font-family: var(--font-sans);
        font-size: 11px;
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .active-range b { font-family: var(--font-mono); font-weight: 600; color: var(--accent-primary); }
    .time-total {
        background: none;
        border: none;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-tertiary);
        cursor: pointer;
        padding: 2px 6px;
        border-radius: var(--radius-sm);
    }
    .time-total:hover { background: var(--bg-hover); color: var(--text-primary); }

    /* ============ Transport ============ */
    .transport {
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
    }

    .skip-btn {
        border: none;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        display: grid;
        place-items: center;
        border-radius: var(--radius-pill);
        transition: color 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
    }
    .skip-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
    .skip-btn:active { transform: scale(0.94); }
    .skip-btn.lg { width: 52px; height: 52px; }
    .skip-btn.lg svg { width: 34px; height: 34px; }
    .skip-btn.sm { width: 40px; height: 40px; }
    .skip-btn.sm svg { width: 24px; height: 24px; }
    .skip-btn svg { display: block; }

    .play-btn {
        width: 62px;
        height: 62px;
        border: none;
        border-radius: var(--radius-pill);
        background: linear-gradient(160deg, var(--accent-glow), var(--accent-secondary));
        color: #241505;
        cursor: pointer;
        display: grid;
        place-items: center;
        box-shadow: 0 8px 22px rgba(232, 169, 104, 0.28);
        transition: transform 0.12s ease, box-shadow 0.2s ease;
    }
    .play-btn:hover { transform: scale(1.04); box-shadow: 0 10px 28px rgba(232, 169, 104, 0.38); }
    .play-btn:active { transform: scale(0.97); }
    .play-btn svg { width: 26px; height: 26px; }
    .play-btn .icon-play { fill: currentColor; }
    .play-btn .icon-pause { fill: currentColor; display: none; }
    .play-btn.playing .icon-play { display: none; }
    .play-btn.playing .icon-pause { display: block; }

    /* ============ Utility row ============ */
    .utility-row {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 12px;
        border-top: 1px solid var(--border-subtle);
    }

    .speed-menu { position: relative; }

    .speed-trigger {
        height: 32px;
        padding: 0 11px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: 12px;
        cursor: pointer;
        transition: all 0.15s ease;
    }
    .speed-trigger:hover { background: var(--bg-elevated); border-color: var(--border-medium); }
    .speed-trigger .val { font-family: var(--font-mono); font-weight: 600; color: var(--accent-primary); }
    .speed-trigger .chev { width: 9px; height: 9px; fill: none; stroke: var(--text-tertiary); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.16s ease; }
    .speed-menu.open .speed-trigger { border-color: var(--accent-line); background: var(--accent-dim); }
    .speed-menu.open .speed-trigger .chev { transform: rotate(180deg); }

    .speed-dropdown {
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        min-width: 150px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-medium);
        border-radius: var(--radius-lg);
        padding: 6px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        opacity: 0;
        transform: translateY(6px) scale(0.98);
        pointer-events: none;
        transition: opacity 0.16s ease, transform 0.16s ease;
        z-index: 20;
    }
    .speed-menu.open .speed-dropdown { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

    .speed-option {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 9px;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        font-size: 12px;
        cursor: pointer;
    }
    .speed-option:hover { background: var(--bg-hover); color: var(--text-primary); }
    .speed-option .sp-val { font-family: var(--font-mono); width: 38px; }
    .speed-option .sp-hint { color: var(--text-tertiary); font-size: 11px; }
    .speed-option .check { margin-left: auto; width: 13px; height: 13px; fill: none; stroke: var(--accent-primary); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
    .speed-option.selected { color: var(--accent-glow); background: var(--accent-dim); }
    .speed-option.selected .check { opacity: 1; }

    .utility-spacer { flex: 1; }

    /* ============ Transcript ============ */
    .transcript { margin-top: 18px; position: relative; }

    .section-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
    }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .section-meta { font-size: 11px; color: var(--text-timecode); font-family: var(--font-mono); }
    .head-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .head-actions .ghost-btn { height: 26px; padding: 0 9px; font-size: 11px; }

    .follow-toggle {
        height: 26px;
        padding: 0 10px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-tertiary);
        color: var(--text-secondary);
        border-radius: var(--radius-pill);
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s ease;
    }
    .follow-toggle:hover { background: var(--bg-elevated); color: var(--text-primary); }
    .follow-toggle .follow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary); }
    .follow-toggle.on { background: var(--accent-dim); border-color: var(--accent-line); color: var(--accent-glow); }
    .follow-toggle.on .follow-dot { background: var(--accent-glow); box-shadow: 0 0 6px rgba(242, 192, 136, 0.7); }
    .follow-toggle:disabled { opacity: 0.45; cursor: not-allowed; }

    .transcript-body {
        position: relative;
        height: 280px;
        overflow-y: auto;
        background: var(--bg-secondary);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        padding: 12px 14px 16px;
        scroll-behavior: smooth;
    }
    .transcript-body::-webkit-scrollbar { width: 8px; }
    .transcript-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }

    .para-label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0 6px;
        font-size: 11px;
        color: var(--text-timecode);
        font-family: var(--font-mono);
    }
    .para-label:first-child { margin-top: 0; }
    .para-line { flex: 1; height: 1px; background: var(--border-subtle); }

    .cue {
        display: flex;
        gap: 10px;
        min-height: 44px;
        padding: 7px 10px 7px 12px;
        border-radius: var(--radius-md);
        cursor: pointer;
        position: relative;
        outline: none;
        transition: background-color 0.18s ease;
    }
    .cue:hover { background: var(--bg-hover); }
    .cue:focus-visible { box-shadow: 0 0 0 2px var(--accent-primary); }
    .cue.active { background: var(--accent-wash); }
    .cue.active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 6px;
        bottom: 6px;
        width: 2px;
        border-radius: 2px;
        background: var(--accent-primary);
    }
    .cue-progress {
        position: absolute;
        left: 2px;
        top: 0;
        height: 2px;
        width: var(--cue-progress, 0%);
        background: var(--accent-line);
        border-radius: 2px;
        pointer-events: none;
    }

    .cue-time {
        width: var(--gutter-width);
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 1px;
        padding-top: 3px;
        font-family: var(--font-mono);
    }
    /* 时间码是「一一对应」的主要读数，11px 也须 ≥4.5:1，不用三级灰 */
    .cue-start { font-size: 11px; color: var(--text-timecode); }
    .cue-end { font-size: 11px; color: var(--text-quaternary); }
    .cue.active .cue-start { color: var(--accent-glow); }
    .cue.active .cue-end { color: var(--accent-secondary); }
    .cue:hover .cue-end { color: var(--text-timecode); }

    .cue-text {
        flex: 1;
        font-size: 14px;
        line-height: 1.95;
        letter-spacing: 0.01em;
        color: var(--text-quaternary);
    }
    .cue.done .cue-text { color: var(--text-secondary); }
    .cue.active .cue-text { color: var(--text-quaternary); }
    .w { position: relative; }
    .w.done { color: var(--text-primary); }
    .w.active { color: var(--accent-glow); }
    .w.active::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: -2px;
        width: var(--wipe, 0%);
        height: 2px;
        background: var(--accent-primary);
        border-radius: 2px;
    }

    .gap-marker {
        padding-left: calc(var(--gutter-width) + 22px);
        font-size: 11px;
        color: var(--text-timecode);
        font-family: var(--font-mono);
        margin: 3px 0;
    }

    .fallback-note {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 11px;
        margin-bottom: 12px;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        background: var(--bg-tertiary);
        color: var(--text-secondary);
        font-size: 11.5px;
    }
    .fallback-note svg { width: 13px; height: 13px; flex-shrink: 0; fill: none; stroke: var(--accent-primary); stroke-width: 1.7; stroke-linecap: round; }
    .transcript-body.static p { font-size: 14.5px; line-height: 2.05; color: var(--text-secondary); letter-spacing: 0.01em; }
    .transcript-body.static p + p { margin-top: 16px; }

    .recenter {
        position: absolute;
        right: 18px;
        bottom: 16px;
        height: 28px;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--accent-line);
        border-radius: var(--radius-pill);
        background: var(--bg-elevated);
        color: var(--accent-glow);
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transform: translateY(6px);
        transition: opacity 0.18s ease, transform 0.18s ease;
        z-index: 4;
    }
    .recenter.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .recenter svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ============ Status bar ============ */
    .statusbar {
        height: 34px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
        background: rgba(12, 13, 16, 0.7);
        border-top: 1px solid var(--border-subtle);
        font-size: 11px;
        color: var(--text-quaternary);
    }
    .status-state { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary); }
    .status-dot.live { background: #6BB87A; box-shadow: 0 0 8px rgba(107, 184, 122, 0.7); }
    .status-dot.paused { background: var(--accent-primary); }
    .align-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .align-badge::before {
        content: '';
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent-primary);
        flex-shrink: 0;
    }
    .align-badge.off::before { background: var(--text-tertiary); }

==========================================================================
设计交接规格 · 字级时间戳对齐（v2）
--------------------------------------------------------------------------
1. 单一时钟：UI 所有状态由 audio.currentTime（秒）派生，倍速只影响推进
   速度与「剩余时间」，绝不改写时间轴；时间码显示的是音频绝对时间。
2. 数据契约（对齐 CosyVoice result-generated 事件）：
   payload.output.sentence = { index, words: [
     { text, begin_index, end_index, begin_time, end_time }  // 毫秒
   ]}，original_text 为句原文。
   本页 buildTimeline() 用同样的字段模拟：每句 = 一组 words，
   sentence.begin/end 取首/末 word 的时间；页面再把 ms 转成秒。
3. 段偏移（真实落地必做）：音频由「标签切段 + AudioConcatenator.merge()」
   拼接，上游每段 words 的时间是段内相对时间。落库前必须
   offset += 该段实际音频时长，把全部 words 映射为最终音频绝对时间。
   本页 SEGMENT_GAP_MS / segmentOffset 即为该规则的演示。
4. 映射算法：二分查找 activeSentence = 最后一个 begin <= t 的句；
   t 落在句间空隙时不高亮任何句（显示「句间停顿」），避免错位；
   activeWord = 最后一个 b <= t 的字；p = (t - b) / (e - b) 驱动擦除。
5. 三层一一对应：波形 left = t / T；时间码 = fmtPrecise(t)；
   句卡时间码 = 该句 begin/end；句边界刻度 left = begin / T。
6. 双向交互：点句 / 点刻度 / 拖波形 → seek(t) 写回同一时钟；
   自动跟随滚动，用户 wheel/touch 打断并出现「回到当前句」。
7. 状态色（对 #15171B 均满足 WCAG AA 4.5:1）：
   已播 #A8ABB4(7.8:1) / 当前句已读 #F5F5F7(16.5:1) / 当前字 #F2C088(10.8:1) /
   未播 #8A8E97(5.5:1) / 当前句底 rgba(232,169,104,.10)。
   时间码是主要读数，单独提亮：句首 #9296A0(6.1:1)、句末 #8A8E97(5.5:1)、
   激活句末 #D49B5B(7.4:1)；禁用三级灰 #6B6E76(3.5:1) 承载 11px 文字。

8. 降级态：无 words[] 时显示静态原文 + 提示条，禁用跟随/刻度/高亮，
   禁止用「字数 ÷ 语速」估算伪造对齐。按 T 可切换该演示态。

<script>
(function () {
    'use strict';

    /* ------------------------------------------------------------------
     * 演示文本（22 句 / 558 字，与既有设计稿一致）
     * ---------------------------------------------------------------- */
    const SENTENCES = [
        '潮水退去的那一刻，整座城市露出了它真正的轮廓。',
        '石板路上的水痕还没有干，倒映着天边最后一点橘红色的光。',
        '阿阮提着灯，沿着海岸线慢慢往前走，脚下的碎石发出细碎的声响。',
        '她已经在这条路上走了七天，鞋底磨破了两双，干粮也只剩最后一块。',
        '传说中，潮汐之城每三十年浮出海面一次，停留的时间从不超过十天。',
        '而这一次，它浮上来已经七天了。',
        '如果她没能在潮水回来之前找到那座钟楼，这趟旅程就再也没有意义了。',
        '风从北面吹过来，带着咸涩的味道，把她的衣角掀了起来。',
        '远处的灯塔亮了一下，又暗了下去，像是在提醒她什么。',
        '她停下脚步，从怀里取出那张已经泛黄的地图。',
        '地图的边角被海水泡得发软，上面的墨迹却依然清晰。',
        '正中央画着一座钟楼，旁边只有一行小字。',
        '上面写着：当潮水退尽，钟声会自己响起来。',
        '阿阮抬起头，看着眼前这座沉默了三十年的城市。',
        '街道两旁的店铺还保持着最后的模样，门半开着，像是主人刚刚离开。',
        '她深吸了一口气，握紧手里的灯，朝着城市中心快步走去。',
        '越往里走，街道越窄，两边的墙壁上爬满了深绿色的海藻。',
        '有一扇窗里还亮着灯，那是这座城市里唯一活着的光。',
        '她放慢脚步，把灯举高了一些，让自己的影子短一点。',
        '钟楼应该就在这条街的尽头，可她眼前出现了三岔路口。',
        '左边的路通向码头，右边的路没入雾里，中间那条被一堵墙封住了。',
        '阿阮闭上眼睛，把耳朵贴在墙上，安静地等着下一次潮声。'
    ];

    const PARAGRAPHS = [8, 7, 7];
    const CREDIT_PER_CHAR = 0.08;

    const SPEEDS = [
        { v: 0.5,  hint: '精听' },
        { v: 0.75, hint: '慢速' },
        { v: 1.0,  hint: '正常' },
        { v: 1.25, hint: '略快' },
        { v: 1.5,  hint: '快速' },
        { v: 2.0,  hint: '极速' }
    ];

    /* ------------------------------------------------------------------
     * 数据契约演示：模拟 CosyVoice result-generated 的 words[] 时间轴
     *
     * 真实接入时把 buildTimeline() 的返回值换成服务端聚合结果即可：
     *   { sentences: [{ index, text, begin, end, words: [
     *       { text, begin_index, end_index, begin_time, end_time }  // 毫秒
     *   ]}], paragraphs: [{ begin, end }], durationMs }
     *
     * ⚠️ 关键：边缘函数按控制标签切段，最终音频由 AudioConcatenator.merge()
     * 拼接。上游每段的 words 时间是「段内相对时间」，落库前必须按段实际
     * 音频时长累加 segmentOffset，全部换算成最终音频的绝对时间。
     * ---------------------------------------------------------------- */
    const CHAR_MS = 240;            // 非标点单字时长
    const PUNCT_MS = 90;           // 标点时长
    const SENTENCE_PAUSE_MS = 450; // 句间停顿
    const SEGMENT_GAP_MS = 620;    // 段间拼接留白
    const PUNCT_RE = /[，。！？、；：,.!?;:]/;

    function buildTimeline() {
        const paragraphs = [];
        const all = [];
        let segmentOffset = 0;   // 累加段偏移（毫秒）
        let si = 0;              // 全局句序号

        PARAGRAPHS.forEach((count, pIdx) => {
            const paraBeginAbs = segmentOffset;
            let cursor = 0;      // 段内相对游标
            const local = [];

            for (let k = 0; k < count; k++) {
                const text = SENTENCES[si];
                const chars = Array.from(text);
                const words = [];
                chars.forEach((ch, ci) => {
                    // 确定性噪声，保证刷新后时间轴逐字节一致
                    const noise = (((si * 13 + ci * 7) % 7) - 3) * 6;
                    const dur = PUNCT_RE.test(ch) ? PUNCT_MS : Math.max(120, CHAR_MS + noise);
                    words.push({
                        text: ch,
                        begin_index: ci,
                        end_index: ci + 1,
                        begin_time: cursor,
                        end_time: cursor + dur
                    });
                    cursor += dur;
                });
                local.push({
                    index: si,
                    text: text,
                    begin: words[0].begin_time,
                    end: words[words.length - 1].end_time,
                    words: words,
                    paragraph: pIdx
                });
                si++;
                cursor += SENTENCE_PAUSE_MS;
            }

            const segmentDuration = cursor; // 段实际时长（含尾部停顿）
            const absolute = local.map(s => ({
                index: s.index,
                text: s.text,
                paragraph: s.paragraph,
                begin: s.begin + segmentOffset,
                end: s.end + segmentOffset,
                words: s.words.map(w => ({
                    text: w.text,
                    begin_index: w.begin_index,
                    end_index: w.end_index,
                    begin_time: w.begin_time + segmentOffset,
                    end_time: w.end_time + segmentOffset
                }))
            }));

            paragraphs.push({
                index: pIdx,
                begin: paraBeginAbs,
                end: segmentOffset + segmentDuration
            });
            all.push.apply(all, absolute);
            segmentOffset += segmentDuration + SEGMENT_GAP_MS;
        });

        return { sentences: all, paragraphs: paragraphs, durationMs: segmentOffset - SEGMENT_GAP_MS };
    }

    const TIMELINE = buildTimeline();

    // 渲染模型统一用「秒」，避免每帧做单位换算；毫秒只存在于数据契约层
    const CUES = TIMELINE.sentences.map(s => ({
        index: s.index,
        text: s.text,
        paragraph: s.paragraph,
        begin: s.begin / 1000,
        end: s.end / 1000,
        words: s.words.map(w => ({ text: w.text, b: w.begin_time / 1000, e: w.end_time / 1000 }))
    }));
    const PARA_META = TIMELINE.paragraphs.map(p => ({ begin: p.begin / 1000, end: p.end / 1000 }));
    const CHAR_COUNT = SENTENCES.join('').length;
    const WORD_COUNT = CUES.reduce((n, c) => n + c.words.length, 0);
    const DURATION = TIMELINE.durationMs / 1000;
    const CREDITS = Math.ceil(CHAR_COUNT * CREDIT_PER_CHAR);

    /* ------------------------------------------------------------------
     * 状态
     * ---------------------------------------------------------------- */
    const state = {
        time: 0,
        playing: false,
        rate: 1.0,
        showRemaining: false,
        scrubbing: false,
        playedBars: -1,
        hasTimeline: true,
        follow: true,
        activeIndex: -2,     // -2 = 尚未渲染过
        lastWordIndex: -2,
        lastTickIndex: -1
    };

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ------------------------------------------------------------------
     * DOM
     * ---------------------------------------------------------------- */
    const $ = id => document.getElementById(id);
    const el = {
        waveform: $('waveform'),
        waveHit: $('waveHit'),
        sentenceTicks: $('sentenceTicks'),
        playhead: $('playhead'),
        hoverBubble: $('hoverBubble'),
        curTime: $('curTime'),
        totalTime: $('totalTime'),
        activeRange: $('activeRange'),
        playBtn: $('playBtn'),
        back15: $('back15'), back5: $('back5'), fwd5: $('fwd5'), fwd15: $('fwd15'),
        speedMenu: $('speedMenu'),
        speedTrigger: $('speedTrigger'),
        speedDropdown: $('speedDropdown'),
        speedVal: $('speedVal'),
        speedHint: $('speedHint'),
        transcriptBody: $('transcriptBody'),
        transcriptContent: $('transcriptContent'),
        sectionMeta: $('sectionMeta'),
        followBtn: $('followBtn'),
        followLabel: $('followLabel'),
        recenterBtn: $('recenterBtn'),
        alignBadge: $('alignBadge'),
        statusDot: $('statusDot'),
        statusText: $('statusText'),
        copyTextBtn: $('copyTextBtn'),
        rewindBtn: $('rewindBtn'),
        exportBtn: $('exportBtn'),
        toast: $('toast')
    };

    let cueEls = [];
    let wordEls = [];
    let tickEls = [];

    /* ------------------------------------------------------------------
     * 工具
     * ---------------------------------------------------------------- */
    function fmt(sec) {
        sec = Math.max(0, Math.floor(sec));
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }
    function fmtPrecise(sec) {
        sec = Math.max(0, sec);
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        const d = Math.floor((sec - Math.floor(sec)) * 10);
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + d;
    }
    function fmtRate(v) { return v.toFixed(2).replace(/0$/, ''); }
    function clamp(v, min, max) { return v < min ? min : (v > max ? max : v); }
    function pad2(n) { return String(n).padStart(2, '0'); }

    let toastTimer = null;
    function toast(msg) {
        el.toast.textContent = msg;
        el.toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1400);
    }

    /* ------------------------------------------------------------------
     * 映射层：二分查找，O(log n)，每帧只跑两次
     * ---------------------------------------------------------------- */
    function findCue(t) {
        let lo = 0, hi = CUES.length - 1, idx = -1;
        while (lo <= hi) {
            const mid = (lo + hi) >> 1;
            if (CUES[mid].begin <= t) { idx = mid; lo = mid + 1; }
            else hi = mid - 1;
        }
        // t 落在句末之后 = 句间停顿（或播放结束），不高亮任何句
        if (idx >= 0 && t > CUES[idx].end) {
            const next = idx + 1 < CUES.length ? idx + 1 : -1;
            return { index: -1, gap: true, next: next, prev: idx };
        }
        return { index: idx, gap: false, next: idx < 0 ? 0 : idx, prev: idx };
    }

    function findWord(cue, t) {
        let lo = 0, hi = cue.words.length - 1, idx = -1;
        while (lo <= hi) {
            const mid = (lo + hi) >> 1;
            if (cue.words[mid].b <= t) { idx = mid; lo = mid + 1; }
            else hi = mid - 1;
        }
        return idx;
    }

    /* ------------------------------------------------------------------
     * 初始化：波形 / 句边界刻度 / 倍速菜单
     * ---------------------------------------------------------------- */
    const BAR_COUNT = 118;
    const bars = [];
    (function buildWaveform() {
        let seed = 20260826;
        function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
        const frag = document.createDocumentFragment();
        for (let i = 0; i < BAR_COUNT; i++) {
            const t = i / (BAR_COUNT - 1);
            const env = 0.42 + 0.34 * Math.sin(t * 11.3) + 0.16 * Math.sin(t * 29.7 + 1.4);
            const h = clamp((env * 0.72 + rnd() * 0.34) * 84, 8, 84);
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            bar.style.height = h.toFixed(1) + 'px';
            frag.appendChild(bar);
            bars.push(bar);
        }
        el.waveform.appendChild(frag);
    })();

    (function buildTicks() {
        const frag = document.createDocumentFragment();
        CUES.forEach((c, i) => {
            const tick = document.createElement('div');
            tick.className = 'tick';
            tick.dataset.index = String(i);
            tick.style.left = (c.begin / DURATION * 100).toFixed(3) + '%';
            tick.title = '第 ' + (i + 1) + ' 句 · ' + fmtPrecise(c.begin);
            tick.addEventListener('pointerdown', e => {
                e.stopPropagation();
                e.preventDefault();
                seek(c.begin);
                toast('第 ' + (i + 1) + ' 句 · ' + fmtPrecise(c.begin));
            });
            tick.addEventListener('click', e => e.stopPropagation());
            frag.appendChild(tick);
            tickEls.push(tick);
        });
        el.sentenceTicks.appendChild(frag);
    })();

    (function buildSpeedMenu() {
        SPEEDS.forEach(s => {
            const opt = document.createElement('div');
            opt.className = 'speed-option' + (s.v === 1.0 ? ' selected' : '');
            opt.dataset.speed = s.v;
            opt.innerHTML =
                '<span class="sp-val">' + fmtRate(s.v) + '×</span>' +
                '<span class="sp-hint">' + s.hint + '</span>' +
                '<svg class="check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
            opt.addEventListener('click', () => setRate(s.v));
            el.speedDropdown.appendChild(opt);
        });
    })();

    /* ------------------------------------------------------------------
     * 对齐阅读区：句卡 + 时间码 gutter + 词级 span
     * ---------------------------------------------------------------- */
    function buildAlignedTranscript() {
        const frag = document.createDocumentFragment();
        cueEls = [];
        wordEls = [];
        let cursor = 0;

        PARAGRAPHS.forEach((count, pIdx) => {
            const label = document.createElement('div');
            label.className = 'para-label';
            label.innerHTML = '<span>段落 ' + pad2(pIdx + 1) + '</span>' +
                '<span>' + fmtPrecise(PARA_META[pIdx].begin) + ' – ' + fmtPrecise(PARA_META[pIdx].end) + '</span>' +
                '<i class="para-line"></i>';
            frag.appendChild(label);

            for (let k = 0; k < count; k++) {
                const global = cursor + k;
                const cue = CUES[global];

                const row = document.createElement('div');
                row.className = 'cue';
                row.dataset.index = String(global);
                row.setAttribute('role', 'button');
                row.setAttribute('tabindex', '0');
                row.setAttribute('aria-label',
                    '第 ' + (global + 1) + ' 句，' + fmtPrecise(cue.begin) + ' 至 ' +
                    fmtPrecise(cue.end) + '，' + cue.text);

                const prog = document.createElement('div');
                prog.className = 'cue-progress';
                row.appendChild(prog);

                const time = document.createElement('div');
                time.className = 'cue-time';
                time.innerHTML = '<span class="cue-start">' + fmtPrecise(cue.begin) + '</span>' +
                    '<span class="cue-end">' + fmtPrecise(cue.end) + '</span>';
                row.appendChild(time);

                const text = document.createElement('div');
                text.className = 'cue-text';
                const spans = [];
                cue.words.forEach(w => {
                    const span = document.createElement('span');
                    span.className = 'w';
                    span.textContent = w.text;
                    text.appendChild(span);
                    spans.push(span);
                });
                wordEls.push(spans);
                row.appendChild(text);

                row.addEventListener('click', () => {
                    seek(cue.begin);
                    toast('定位第 ' + (global + 1) + ' 句 · ' + fmtPrecise(cue.begin));
                });
                row.addEventListener('keydown', e => {
                    if (e.code === 'Space' || e.code === 'Enter') {
                        e.preventDefault();
                        e.stopPropagation();
                        seek(cue.begin);
                        toast('定位第 ' + (global + 1) + ' 句 · ' + fmtPrecise(cue.begin));
                    }
                });

                frag.appendChild(row);
                cueEls.push(row);
            }
            cursor += count;

            if (pIdx < PARAGRAPHS.length - 1) {
                const gapMs = (CUES[cursor].begin - CUES[cursor - 1].end);
                const marker = document.createElement('div');
                marker.className = 'gap-marker';
                marker.textContent = '· 段间停顿 ' + gapMs.toFixed(2) + 's（无文本，不高亮）';
                frag.appendChild(marker);
            }
        });

        el.transcriptContent.appendChild(frag);
    }

    function buildStaticTranscript() {
        const note = document.createElement('div');
        note.className = 'fallback-note';
        note.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
            '<span>该音频没有字级时间戳，文本按原文静态展示，不使用估算时间伪造高亮。</span>';
        el.transcriptContent.appendChild(note);

        let cursor = 0;
        PARAGRAPHS.forEach(n => {
            const p = document.createElement('p');
            p.textContent = SENTENCES.slice(cursor, cursor + n).join('');
            cursor += n;
            el.transcriptContent.appendChild(p);
        });
    }

    function rebuildTranscript() {
        el.transcriptContent.replaceChildren();
        el.transcriptBody.classList.toggle('static', !state.hasTimeline);
        el.sentenceTicks.classList.toggle('off', !state.hasTimeline);
        cueEls = [];
        wordEls = [];
        state.activeIndex = -2;
        state.lastWordIndex = -2;
        state.lastTickIndex = -1;

        if (state.hasTimeline) buildAlignedTranscript();
        else buildStaticTranscript();

        el.followBtn.disabled = !state.hasTimeline;
        el.followBtn.setAttribute('aria-pressed', String(state.hasTimeline && state.follow));
        el.followBtn.classList.toggle('on', state.hasTimeline && state.follow);
        el.followLabel.textContent = '跟随播放';
        el.recenterBtn.classList.remove('show');
        el.sectionMeta.textContent = state.hasTimeline
            ? CUES.length + ' 句 · ' + CHAR_COUNT + ' 字 · 字级对齐'
            : '静态文本 · 无时间轴';
        el.alignBadge.textContent = state.hasTimeline
            ? '字级时间戳 · ' + CUES.length + ' 句 / ' + WORD_COUNT + ' 锚点 · 已对齐'
            : '无时间戳 · 静态文本 · 未对齐';
        el.alignBadge.classList.toggle('off', !state.hasTimeline);
        el.transcriptBody.scrollTop = 0;
    }

    /* ------------------------------------------------------------------
     * 播放引擎（模拟）
     * 接真实音频时把 tick / seek / rate 换成 <audio> 的对应调用即可；
     * 注意倍速只改推进速度，state.time 始终是音频时间轴上的真实秒数。
     * ---------------------------------------------------------------- */
    let lastFrame = 0;
    function frame(now) {
        if (!state.playing) return;
        if (!lastFrame) lastFrame = now;
        const dt = (now - lastFrame) / 1000;
        lastFrame = now;

        state.time += dt * state.rate;
        if (state.time >= DURATION) {
            state.time = DURATION;
            pause();
            setStatus('播放结束');
            render();
            return;
        }
        render();
        requestAnimationFrame(frame);
    }

    function play() {
        if (state.playing) return;
        if (state.time >= DURATION) state.time = 0;
        state.playing = true;
        lastFrame = 0;
        el.playBtn.classList.add('playing');
        setStatus('正在播放 · ' + fmtRate(state.rate) + '×');
        requestAnimationFrame(frame);
    }

    function pause() {
        if (!state.playing) return;
        state.playing = false;
        el.playBtn.classList.remove('playing');
        setStatus('已暂停 · ' + fmtPrecise(state.time));
    }

    function toggle() { state.playing ? pause() : play(); }

    function seek(sec) {
        state.time = clamp(sec, 0, DURATION);
        render();
        if (state.playing) setStatus('正在播放 · ' + fmtRate(state.rate) + '×');
        else setStatus('已暂停 · ' + fmtPrecise(state.time));
    }

    function skip(delta) {
        seek(state.time + delta);
        toast((delta > 0 ? '前进 ' : '后退 ') + Math.abs(delta) + ' 秒 · ' + fmtPrecise(state.time));
    }

    function skipCue(dir) {
        if (!state.hasTimeline) return;
        const found = findCue(state.time);
        let target;
        if (dir > 0) {
            target = found.gap ? found.next : found.index + 1;
            if (target < 0 || target >= CUES.length) { toast('已是最后一句'); return; }
        } else {
            // 当前句已读超过 0.6s 时，「上一句」先回到本句句首
            const cur = found.gap ? found.prev : found.index;
            target = (cur >= 0 && state.time - CUES[cur].begin > 0.6) ? cur : cur - 1;
            if (target < 0) target = 0;
        }
        seek(CUES[target].begin);
        toast('第 ' + (target + 1) + ' / ' + CUES.length + ' 句 · ' + fmtPrecise(CUES[target].begin));
    }

    function setRate(v) {
        state.rate = v;
        el.speedVal.textContent = fmtRate(v) + '×';
        Array.prototype.forEach.call(el.speedDropdown.children, o => {
            o.classList.toggle('selected', parseFloat(o.dataset.speed) === v);
        });
        el.speedMenu.classList.remove('open');
        const saved = (DURATION - state.time) / v;
        el.speedHint.textContent = '剩余约 ' + fmt(saved) + ' · 已完成 ' +
            Math.round(state.time / DURATION * 100) + '%';
        if (state.playing) setStatus('正在播放 · ' + fmtRate(v) + '×');
        toast('播放速度 ' + fmtRate(v) + '×');
    }

    function setStatus(text) {
        el.statusText.textContent = text;
        el.statusDot.className = 'status-dot' + (state.playing ? ' live' : (state.time > 0 ? ' paused' : ''));
    }

    function setFollow(on) {
        if (!state.hasTimeline) return;
        state.follow = on;
        el.followBtn.classList.toggle('on', on);
        el.followBtn.setAttribute('aria-pressed', String(on));
        el.recenterBtn.classList.toggle('show', !on);
        if (on) {
            const found = findCue(state.time);
            scrollToCue(found.index >= 0 ? found.index : found.next);
        }
        toast(on ? '已开启自动跟随' : '已暂停跟随（手动滚动）');
    }

    function scrollToCue(i) {
        if (i < 0 || i >= cueEls.length) return;
        const body = el.transcriptBody;
        const node = cueEls[i];
        const br = body.getBoundingClientRect();
        const nr = node.getBoundingClientRect();
        const target = body.scrollTop + (nr.top - br.top) - br.height / 2 + nr.height / 2;
        // 'auto' 会沿用 CSS 的 scroll-behavior:smooth，减弱动态效果时仍会动画；
        // 必须用 'instant' 才是真正立即滚动。
        body.scrollTo({ top: Math.max(0, target), behavior: reduceMotion ? 'instant' : 'smooth' });
    }

    /* ------------------------------------------------------------------
     * 渲染：单一时钟派生全部视图
     * ---------------------------------------------------------------- */
    // 清空某一句的全部字状态。只在切句时调用，避免每帧遍历 558 个 span。
    function clearCueWords(i) {
        const spans = wordEls[i];
        if (!spans) return;
        spans.forEach(s => {
            s.classList.remove('done', 'active');
            s.style.removeProperty('--wipe');
        });
    }

    function renderTranscript(t) {
        if (!state.hasTimeline || cueEls.length === 0) return;

        const found = findCue(t);
        const idx = found.index;

        if (idx !== state.activeIndex) {
            for (let i = 0; i < cueEls.length; i++) {
                const row = cueEls[i];
                const isDone = i < idx || (idx === -1 && t > CUES[i].end);
                row.classList.toggle('active', i === idx);
                row.classList.toggle('done', isDone);
                if (i !== idx) row.style.removeProperty('--cue-progress');
            }
            if (state.lastTickIndex >= 0) tickEls[state.lastTickIndex].classList.remove('current');
            if (idx >= 0) { tickEls[idx].classList.add('current'); state.lastTickIndex = idx; }
            else state.lastTickIndex = -1;

            // 只清掉上一句 + 目标句残留的字状态，不遍历全部 558 个 span。
            // 目标句也要清：seek 回跳到「曾经读过」的句子时，该句可能残留 done/active。
            if (state.activeIndex >= 0 && state.activeIndex !== idx) clearCueWords(state.activeIndex);
            if (idx >= 0) clearCueWords(idx);
            state.activeIndex = idx;
            state.lastWordIndex = -2;

            if (state.follow) scrollToCue(idx >= 0 ? idx : found.next);
        }

        if (idx >= 0) {
            const cue = CUES[idx];
            const spans = wordEls[idx];
            const wi = findWord(cue, t);
            if (wi !== state.lastWordIndex) {
                // seek 可能向前也可能向后。区间必须覆盖「旧 active 字 → 新 active 字」，
                // 并利用 toggle 把旧字的 .active 关掉；只处理新增区间会残留多个高亮字。
                const from = Math.max(0, Math.min(wi, state.lastWordIndex));
                const to = Math.min(spans.length - 1, Math.max(wi, state.lastWordIndex));
                for (let j = from; j <= to; j++) {
                    spans[j].classList.toggle('done', j < wi);
                    spans[j].classList.toggle('active', j === wi);
                    if (j !== wi) spans[j].style.removeProperty('--wipe');
                }
                state.lastWordIndex = wi;
            }
            if (wi >= 0) {
                const w = cue.words[wi];
                const p = clamp((t - w.b) / Math.max(0.001, w.e - w.b), 0, 1);
                spans[wi].style.setProperty('--wipe', (p * 100).toFixed(1) + '%');
            }
            cueEls[idx].style.setProperty('--cue-progress',
                (clamp((t - cue.begin) / Math.max(0.001, cue.end - cue.begin), 0, 1) * 100).toFixed(2) + '%');
        }
    }

    function renderActiveRange(t) {
        if (!state.hasTimeline) {
            el.activeRange.textContent = '无时间戳 · 文本与时间轴未建立映射';
            return;
        }
        const found = findCue(t);
        if (found.index < 0) {
            const prev = found.prev >= 0 ? CUES[found.prev].end : 0;
            const next = found.next >= 0 ? CUES[found.next].begin : DURATION;
            el.activeRange.innerHTML = (found.next < 0 ? '播放结束' : '句间停顿') +
                ' <b>' + Math.max(0, next - prev).toFixed(1) + 's</b> · 下一句 ' +
                (found.next >= 0 ? pad2(found.next + 1) : '--');
        } else {
            const c = CUES[found.index];
            el.activeRange.innerHTML = '第 <b>' + pad2(found.index + 1) + ' / ' + CUES.length +
                '</b> 句 · <b>' + fmtPrecise(c.begin) + ' – ' + fmtPrecise(c.end) + '</b>';
        }
    }

    function render() {
        const t = state.time;
        const pct = t / DURATION * 100;

        el.playhead.style.left = pct.toFixed(3) + '%';

        const played = Math.round(pct / 100 * BAR_COUNT);
        if (played !== state.playedBars) {
            const from = Math.min(played, state.playedBars + 1);
            const to = Math.max(played, state.playedBars + 1);
            for (let i = Math.max(0, from); i < Math.min(BAR_COUNT, to + 1); i++) {
                bars[i].classList.toggle('played', i < played);
            }
            state.playedBars = played;
        }

        el.curTime.textContent = fmtPrecise(t);
        el.totalTime.textContent = state.showRemaining ? '-' + fmt(DURATION - t) : fmt(DURATION);
        el.speedHint.textContent = state.playing
            ? '剩余约 ' + fmt((DURATION - t) / state.rate)
            : '剩余约 ' + fmt((DURATION - t) / state.rate) + ' · 已完成 ' +
              Math.round(t / DURATION * 100) + '%';

        renderActiveRange(t);
        renderTranscript(t);
    }

    /* ------------------------------------------------------------------
     * 波形交互：hover 显示「时间 + 所属句」，点击 / 拖动 seek
     * ---------------------------------------------------------------- */
    function timeAtX(clientX) {
        const rect = el.waveform.getBoundingClientRect();
        const ratio = clamp((clientX - rect.left) / rect.width, 0, 1);
        return { t: ratio * DURATION, ratio: ratio };
    }

    el.waveHit.addEventListener('pointerdown', e => {
        state.scrubbing = true;
        el.waveHit.setPointerCapture(e.pointerId);
        const r = timeAtX(e.clientX);
        seek(r.t);
        if (!state.playing) setStatus('已暂停 · ' + fmtPrecise(state.time));
    });

    el.waveHit.addEventListener('pointermove', e => {
        const tick = e.target && e.target.closest ? e.target.closest('.tick') : null;
        let t, label;
        if (tick && state.hasTimeline) {
            const i = parseInt(tick.dataset.index, 10);
            t = CUES[i].begin;
            label = '第 ' + (i + 1) + ' 句 · ' + fmtPrecise(t);
        } else {
            const r = timeAtX(e.clientX);
            t = r.t;
            const f = state.hasTimeline ? findCue(t) : null;
            label = fmtPrecise(t) + (f ? (f.index >= 0 ? ' · 第 ' + (f.index + 1) + ' 句' : ' · 句间停顿') : '');
        }
        el.hoverBubble.textContent = label;
        el.hoverBubble.style.left = (clamp(t / DURATION, 0, 1) * 100).toFixed(2) + '%';
        if (state.scrubbing && !tick) seek(t);
    });

    el.waveHit.addEventListener('pointerup', () => { state.scrubbing = false; });
    el.waveHit.addEventListener('pointercancel', () => { state.scrubbing = false; });

    /* ------------------------------------------------------------------
     * 控件绑定
     * ---------------------------------------------------------------- */
    el.playBtn.addEventListener('click', toggle);
    el.back15.addEventListener('click', () => skip(-15));
    el.back5.addEventListener('click', () => skip(-5));
    el.fwd5.addEventListener('click', () => skip(5));
    el.fwd15.addEventListener('click', () => skip(15));

    el.speedTrigger.addEventListener('click', e => {
        e.stopPropagation();
        el.speedMenu.classList.toggle('open');
    });
    document.addEventListener('click', () => el.speedMenu.classList.remove('open'));
    el.speedDropdown.addEventListener('click', e => e.stopPropagation());

    el.totalTime.addEventListener('click', () => {
        state.showRemaining = !state.showRemaining;
        render();
        toast(state.showRemaining ? '显示剩余时间' : '显示总时长');
    });

    el.rewindBtn.addEventListener('click', () => { seek(0); toast('已回到开头'); });
    el.exportBtn.addEventListener('click', () => toast('已导出 音频.m4a'));
    el.followBtn.addEventListener('click', () => setFollow(!state.follow));
    el.recenterBtn.addEventListener('click', () => setFollow(true));

    // 用户主动滚动打断自动跟随；程序滚动不会触发 wheel/touchstart
    function userScroll() {
        if (state.follow && state.hasTimeline) setFollow(false);
    }
    el.transcriptBody.addEventListener('wheel', userScroll, { passive: true });
    el.transcriptBody.addEventListener('touchstart', userScroll, { passive: true });

    el.copyTextBtn.addEventListener('click', () => {
        const text = SENTENCES.join('\n');
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => toast('文本已复制'), () => toast('复制失败'));
        } else {
            toast('当前环境不支持剪贴板');
        }
    });

    /* ------------------------------------------------------------------
     * 键盘快捷键
     * ---------------------------------------------------------------- */
    document.addEventListener('keydown', e => {
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea') return;

        // 句块获得焦点时，空格 / 回车是「定位到该句」，不触发全局播放
        const cueTarget = e.target && e.target.closest ? e.target.closest('.cue') : null;
        if (cueTarget && (e.code === 'Space' || e.code === 'Enter')) return;

        if (e.code === 'Space') { e.preventDefault(); toggle(); return; }
        if (e.key === 'ArrowLeft') { e.preventDefault(); skip(e.shiftKey ? -15 : -5); return; }
        if (e.key === 'ArrowRight') { e.preventDefault(); skip(e.shiftKey ? 15 : 5); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); skipCue(-1); return; }
        if (e.key === 'ArrowDown') { e.preventDefault(); skipCue(1); return; }
        if (e.key === 'Home') { e.preventDefault(); seek(0); return; }
        if (e.key === 'End') { e.preventDefault(); seek(DURATION); return; }
        if (e.key === 'f' || e.key === 'F') { e.preventDefault(); setFollow(!state.follow); return; }
        if (e.key === 't' || e.key === 'T') {
            e.preventDefault();
            state.hasTimeline = !state.hasTimeline;
            rebuildTranscript();
            render();
            toast(state.hasTimeline ? '已启用字级时间戳' : '已切换为无时间戳降级态');
        }
    });

    /* ------------------------------------------------------------------
     * 静态信息填充 + 首帧
     * ---------------------------------------------------------------- */
    $('metaDuration').textContent = fmt(DURATION);
    $('metaDurationSub').textContent = DURATION.toFixed(1) + 's';
    $('metaChars').innerHTML = CHAR_COUNT + '<span class="unit">字</span>';
    $('metaCharsSub').textContent = CUES.length + ' 句 · ' + WORD_COUNT + ' 字级锚点';
    $('metaCredits').innerHTML = CREDITS + '<span class="unit">分</span>';
    $('metaCreditsSub').textContent = CHAR_COUNT + ' 字 × ' + CREDIT_PER_CHAR;

    rebuildTranscript();
    render();
})();
</script>
</body>
</html>
