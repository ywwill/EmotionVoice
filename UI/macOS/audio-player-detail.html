<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频播放详情 - EmotionVoice</title>
    <style>
        :root {
            --bg-primary: #0E0F12;
            --bg-secondary: #15171B;
            --bg-tertiary: #1C1F24;
            --bg-elevated: #22262D;
            --bg-hover: rgba(255, 255, 255, 0.06);
            --accent-primary: #E8A968;
            --accent-secondary: #D49B5B;
            --accent-glow: #F2C088;
            --accent-dim: rgba(232, 169, 104, 0.15);
            --text-primary: #F5F5F7;
            --text-secondary: #A8ABB4;
            --text-tertiary: #6B6E76;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-medium: rgba(255, 255, 255, 0.15);
            --macos-red: #FF453A;
            --toolbar-height: 52px;
            --sidebar-width: 220px;
            --list-width: 340px;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 13px;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            overflow: hidden;
        }

        .macos-window { height: 100vh; display: flex; flex-direction: column; }

        /* Title Bar */
        .titlebar {
            height: var(--toolbar-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: linear-gradient(180deg, rgba(30, 32, 37, 0.95) 0%, rgba(21, 23, 27, 0.9) 100%);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .traffic-lights { display: flex; gap: 8px; }
        .traffic-light { width: 12px; height: 12px; border-radius: 50%; }
        .traffic-light.close { background: #FF453A; }
        .traffic-light.minimize { background: #FFD60A; }
        .traffic-light.zoom { background: #30D158; }

        .titlebar-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Layout */
        .app-body { flex: 1; display: flex; overflow: hidden; }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(14, 15, 18, 0.4);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-section { padding: 16px 12px; }

        .sidebar-section-title {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0 12px;
            margin-bottom: 8px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .sidebar-item:hover { background: var(--bg-hover); color: var(--text-primary); }

        .sidebar-item.active { background: var(--bg-elevated); color: var(--text-primary); }

        .sidebar-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 18px;
            background: var(--accent-primary);
            border-radius: 0 2px 2px 0;
        }

        .sidebar-divider { height: 1px; background: var(--border-subtle); margin: 8px 16px; }

        .sidebar-footer { margin-top: auto; padding: 16px; border-top: 1px solid var(--border-subtle); }

        .credits-card {
            background: linear-gradient(135deg, rgba(232, 169, 104, 0.12), rgba(232, 169, 104, 0.04));
            border: 1px solid rgba(232, 169, 104, 0.25);
            border-radius: var(--radius-md);
            padding: 12px;
        }

        .credits-label { font-size: 10px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .credits-value { font-size: 20px; font-weight: 700; color: var(--accent-glow); font-family: 'SF Mono', monospace; margin-bottom: 2px; }
        .credits-meta { font-size: 11px; color: var(--text-tertiary); }

        /* Audio List Panel */
        .audio-list-panel {
            width: var(--list-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: relative;
        }

        .list-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .list-header-left { display: flex; align-items: center; gap: 10px; }
        .list-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        .list-count { font-size: 12px; color: var(--text-tertiary); }

        .list-search { padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); }

        .search-input {
            width: 100%;
            height: 32px;
            padding: 0 12px 0 32px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.15s ease;
        }

        .search-input:focus { border-color: var(--accent-primary); background: var(--bg-elevated); }
        .search-container { position: relative; }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); }

        .audio-list { flex: 1; overflow-y: auto; padding: 8px 12px 80px; }

        /* Audio Item */
        .audio-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.15s ease;
            margin-bottom: 2px;
            position: relative;
        }

        .audio-item:hover { background: var(--bg-hover); }
        .audio-item.selected { background: var(--bg-elevated); }
        .audio-item.playing { background: var(--accent-dim); }

        /* Checkbox - only show in multiselect mode */
        .audio-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 1.5px solid var(--border-medium);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.15s ease;
            opacity: 0;
            pointer-events: none;
        }

        .audio-item.in-multiselect .audio-checkbox {
            opacity: 1;
            pointer-events: auto;
        }

        .audio-checkbox:hover { border-color: var(--accent-primary); }
        .audio-checkbox.checked { background: var(--accent-primary); border-color: var(--accent-primary); }
        .audio-checkbox.checked svg { display: block; }
        .audio-checkbox svg { width: 11px; height: 11px; stroke: var(--bg-primary); stroke-width: 2.5; fill: none; display: none; }

        .audio-item-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--bg-primary);
            flex-shrink: 0;
        }

        .audio-item.playing .audio-item-avatar { animation: pulse-glow 2s ease-in-out infinite; }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(232, 169, 104, 0.4); }
            50% { box-shadow: 0 0 0 6px rgba(232, 169, 104, 0); }
        }

        .audio-item-info { flex: 1; min-width: 0; }

        .audio-item-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .audio-item-meta { font-size: 11px; color: var(--text-tertiary); display: flex; align-items: center; gap: 6px; }

        /* More Button */
        .more-btn {
            width: 24px;
            height: 24px;
            border-radius: var(--radius-sm);
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            cursor: pointer;
            opacity: 0;
            transition: all 0.12s ease;
            flex-shrink: 0;
        }

        .audio-item:hover .more-btn { opacity: 1; }
        .more-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .more-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        /* Row More Menu */
        .row-more-menu {
            position: fixed;
            min-width: 160px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            padding: 4px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.96) translateY(-4px);
            transition: all 0.12s ease;
        }

        .row-more-menu.visible {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        .row-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .row-menu-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .row-menu-item.danger:hover { background: rgba(255, 69, 58, 0.12); color: var(--macos-red); }
        .row-menu-item svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; }
        .row-menu-divider { height: 1px; background: var(--border-subtle); margin: 4px 0; }

        /* Bottom Selection Bar */
        .selection-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-medium);
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: translateY(100%);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .selection-bar.visible { transform: translateY(0); }

        .selection-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .selection-count-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 24px;
            padding: 0 8px;
            background: var(--accent-primary);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--bg-primary);
        }

        .selection-text { font-size: 13px; color: var(--text-secondary); }

        .selection-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .sel-btn {
            height: 32px;
            padding: 0 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.12s ease;
            border: none;
        }

        .sel-btn.ghost {
            background: transparent;
            color: var(--text-tertiary);
            padding: 0 10px;
        }

        .sel-btn.ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

        .sel-btn.danger {
            background: rgba(255, 69, 58, 0.12);
            color: var(--macos-red);
            border: 1px solid rgba(255, 69, 58, 0.3);
        }

        .sel-btn.danger:hover { background: rgba(255, 69, 58, 0.2); }

        .sel-btn.primary {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border: 1px solid var(--accent-primary);
        }

        .sel-btn.primary:hover { background: var(--accent-glow); }

        .sel-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; }

        /* Player Panel */
        .player-panel { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); overflow: hidden; }

        .player-toolbar {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: rgba(21, 23, 27, 0.5);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .player-toolbar-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }

        .toolbar-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .toolbar-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .toolbar-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; }

        /* Empty State */
        .player-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
        .player-empty-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--bg-secondary); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 24px; }
        .player-empty-title { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
        .player-empty-desc { font-size: 12px; color: var(--text-tertiary); }

        /* Player Content */
        .player-content { flex: 1; overflow-y: auto; padding: 32px 48px; display: flex; flex-direction: column; align-items: center; }
        .player-inner { width: 100%; max-width: 700px; }

        .audio-header { margin-bottom: 28px; text-align: center; }
        .audio-title { font-size: 22px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; line-height: 1.3; }
        .audio-meta { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--text-tertiary); }

        /* Waveform */
        .waveform-section { margin-bottom: 20px; }
        .waveform-container { position: relative; height: 72px; background: var(--bg-secondary); border-radius: var(--radius-md); overflow: hidden; cursor: pointer; border: 1px solid var(--border-subtle); }
        .waveform-container:hover { border-color: var(--border-medium); }
        .waveform { display: flex; align-items: center; justify-content: space-between; height: 100%; padding: 10px 14px; gap: 2px; }
        .waveform-bar { flex: 1; max-width: 4px; background: var(--bg-elevated); border-radius: 2px; transition: background 0.2s ease; }
        .waveform-bar.played { background: var(--accent-primary); }
        .waveform-progress-indicator { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent-glow); box-shadow: 0 0 8px rgba(232, 169, 104, 0.6); pointer-events: none; display: none; }
        .waveform-container:hover .waveform-progress-indicator { display: block; }
        .time-display { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; font-family: 'SF Mono', monospace; color: var(--text-tertiary); }

        /* Playback Controls */
        .playback-controls { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; }

        .control-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            color: var(--text-secondary);
        }

        .control-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .control-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }
        .control-btn.skip-btn { width: 44px; height: 36px; border-radius: 18px; }

        .play-btn {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
            box-shadow: 0 4px 16px rgba(232, 169, 104, 0.3);
        }

        .play-btn:hover { background: linear-gradient(135deg, var(--accent-glow), var(--accent-primary)); transform: scale(1.03); }
        .play-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: currentColor; }

        /* Speed Control */
        .speed-control { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; }
        .speed-label { font-size: 11px; color: var(--text-tertiary); }
        .speed-menu { position: relative; }

        .speed-btn {
            height: 26px;
            padding: 0 10px;
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 11px;
            font-family: 'SF Mono', monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .speed-btn:hover { background: var(--bg-elevated); border-color: var(--border-medium); color: var(--text-primary); }

        .speed-dropdown {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            min-width: 90px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            padding: 4px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.15s ease;
            z-index: 100;
        }

        .speed-menu.open .speed-dropdown { opacity: 1; visibility: visible; }
        .speed-option { padding: 6px 10px; border-radius: var(--radius-sm); font-size: 11px; font-family: 'SF Mono', monospace; color: var(--text-secondary); cursor: pointer; transition: all 0.1s ease; }
        .speed-option:hover { background: var(--bg-hover); color: var(--text-primary); }
        .speed-option.selected { background: var(--accent-dim); color: var(--accent-glow); }

        /* Action Buttons */
        .audio-actions { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }

        .action-btn {
            height: 30px;
            padding: 0 14px;
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .action-btn:hover { background: var(--bg-elevated); border-color: var(--border-medium); color: var(--text-primary); }
        .action-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.5; }

        /* Voice Info */
        .voice-info { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--bg-secondary); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); margin-bottom: 20px; }
        .voice-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--bg-primary); flex-shrink: 0; }
        .voice-details { flex: 1; }
        .voice-name { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 3px; }
        .voice-meta { font-size: 11px; color: var(--text-tertiary); }
        .voice-badge { padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 600; background: var(--accent-dim); color: var(--accent-glow); }

        .section-divider { height: 1px; background: var(--border-subtle); margin: 20px 0; }

        .original-text-section { margin-bottom: 24px; }
        .section-title { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
        .original-text { background: var(--bg-secondary); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); padding: 16px; max-height: 160px; overflow-y: auto; }
        .original-text-content { font-size: 13px; line-height: 1.6; color: var(--text-secondary); white-space: pre-wrap; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 3px; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-elevated);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            padding: 10px 20px;
            font-size: 12px;
            color: var(--text-primary);
            z-index: 1000;
            animation: toastIn 0.2s ease;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Edit Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .modal-overlay.visible { opacity: 1; visibility: visible; }

        .modal {
            width: 400px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }

        .modal-overlay.visible .modal { transform: scale(1); }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; }
        .modal-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }

        .modal-close {
            width: 24px;
            height: 24px;
            border-radius: var(--radius-sm);
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 16px;
        }

        .modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }
        .modal-body { padding: 20px; }

        .modal-input {
            width: 100%;
            height: 36px;
            padding: 0 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
        }

        .modal-input:focus { border-color: var(--accent-primary); }
        .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: flex-end; gap: 8px; }

        .modal-btn { height: 32px; padding: 0 16px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s ease; }
        .modal-btn.cancel { background: transparent; border: 1px solid var(--border-medium); color: var(--text-secondary); }
        .modal-btn.cancel:hover { background: var(--bg-hover); color: var(--text-primary); }
        .modal-btn.confirm { background: var(--accent-primary); border: 1px solid var(--accent-primary); color: var(--bg-primary); }
        .modal-btn.confirm:hover { background: var(--accent-glow); }
    </style>
</head>
<body>
    <div class="macos-window">
        <div class="titlebar">
            <div class="traffic-lights">
                <div class="traffic-light close"></div>
                <div class="traffic-light minimize"></div>
                <div class="traffic-light zoom"></div>
            </div>
            <div class="titlebar-center">EmotionVoice</div>
            <div style="width: 80px;"></div>
        </div>

        <div class="app-body">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-item active"><span>全部音频</span></div>
                    <div class="sidebar-item"><span>最近播放</span></div>
                    <div class="sidebar-item"><span>收藏</span></div>
                </div>
                <div class="sidebar-divider"></div>
                <div class="sidebar-section">
                    <div class="sidebar-section-title">项目</div>
                    <div class="sidebar-item"><span>有声书系列</span></div>
                    <div class="sidebar-item"><span>播客内容</span></div>
                    <div class="sidebar-item"><span>短视频配音</span></div>
                </div>
                <div class="sidebar-footer">
                    <div class="credits-card">
                        <div class="credits-label">积分余额</div>
                        <div class="credits-value">1,280</div>
                        <div class="credits-meta">有效期至 2027/08/08</div>
                    </div>
                </div>
            </aside>

            <div class="audio-list-panel">
                <div class="list-header">
                    <div class="list-header-left">
                        <span class="list-title">全部音频</span>
                        <span class="list-count" id="listCount">6 个</span>
                    </div>
                </div>
                <div class="list-search">
                    <div class="search-container">
                        <span class="search-icon">🔍</span>
                        <input type="text" class="search-input" placeholder="搜索音频..." id="searchInput">
                    </div>
                </div>
                <div class="audio-list" id="audioList"></div>

                <!-- Selection Bar -->
                <div class="selection-bar" id="selectionBar">
                    <div class="selection-info">
                        <span class="selection-count-badge" id="selectionCountBadge">0</span>
                        <span class="selection-text">已选择</span>
                    </div>
                    <div class="selection-actions">
                        <button class="sel-btn ghost" id="selectAllBtn">
                            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><polyline points="9 11 12 14 22 4"/></svg>
                            全选
                        </button>
                        <button class="sel-btn ghost" id="deselectBtn">取消</button>
                        <div style="flex: 1;"></div>
                        <button class="sel-btn danger" id="deleteSelectedBtn">
                            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            删除
                        </button>
                        <button class="sel-btn primary" id="exportSelectedBtn">
                            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            导出
                        </button>
                    </div>
                </div>
            </div>

            <div class="player-panel">
                <div class="player-toolbar">
                    <span class="player-toolbar-title" id="playerTitle">选择音频播放</span>
                    <button class="toolbar-btn" id="shareBtn">
                        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                    </button>
                </div>

                <div class="player-empty" id="playerEmpty">
                    <div class="player-empty-icon">🎵</div>
                    <div class="player-empty-title">选择一个音频</div>
                    <div class="player-empty-desc">从左侧列表中选择要播放的音频</div>
                </div>

                <div class="player-content" id="playerContent" style="display: none;">
                    <div class="player-inner">
                        <header class="audio-header">
                            <h1 class="audio-title" id="audioTitle">产品介绍</h1>
                            <div class="audio-meta">
                                <span id="audioVoice">中文女声 · 晓晓</span>
                                <span>·</span>
                                <span id="audioDuration">03:48</span>
                                <span>·</span>
                                <span id="audioCost">76 积分</span>
                            </div>
                        </header>

                        <section class="waveform-section">
                            <div class="waveform-container" id="waveformContainer">
                                <div class="waveform" id="waveform"></div>
                                <div class="waveform-progress-indicator" id="progressIndicator"></div>
                            </div>
                            <div class="time-display">
                                <span id="currentTimeDisplay">00:00</span>
                                <span id="totalTimeDisplay">03:48</span>
                            </div>
                        </section>

                        <div class="playback-controls">
                            <button class="control-btn skip-btn" id="skipBackBtn">
                                <svg viewBox="0 0 24 24"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></svg>
                            </button>
                            <button class="control-btn skip-btn" id="skipBack5Btn">
                                <svg viewBox="0 0 24 24"><polygon points="11 19 2 12 11 5 11 19"/></svg>
                            </button>
                            <button class="control-btn play-btn" id="playBtn">
                                <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                            </button>
                            <button class="control-btn skip-btn" id="skipForward5Btn">
                                <svg viewBox="0 0 24 24"><polygon points="13 19 22 12 13 5 13 19"/></svg>
                            </button>
                            <button class="control-btn skip-btn" id="skipForwardBtn">
                                <svg viewBox="0 0 24 24"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg>
                            </button>
                        </div>

                        <div class="speed-control">
                            <span class="speed-label">播放速度</span>
                            <div class="speed-menu" id="speedMenu">
                                <button class="speed-btn" id="speedBtn">
                                    <span id="currentSpeed">1×</span>
                                    <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                                </button>
                                <div class="speed-dropdown">
                                    <div class="speed-option" data-speed="0.5">0.5×</div>
                                    <div class="speed-option" data-speed="0.75">0.75×</div>
                                    <div class="speed-option selected" data-speed="1">1×</div>
                                    <div class="speed-option" data-speed="1.25">1.25×</div>
                                    <div class="speed-option" data-speed="1.5">1.5×</div>
                                    <div class="speed-option" data-speed="2">2×</div>
                                </div>
                            </div>
                        </div>

                        <div class="audio-actions">
                            <button class="action-btn" id="exportBtn">
                                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                导出
                            </button>
                            <button class="action-btn" id="copyNameBtn">
                                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                复制名称
                            </button>
                            <button class="action-btn" id="favoriteBtn">
                                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                收藏
                            </button>
                        </div>

                        <div class="voice-info">
                            <div class="voice-avatar" id="voiceAvatar">晓</div>
                            <div class="voice-details">
                                <div class="voice-name" id="voiceName">晓晓 · 旗舰音色</div>
                                <div class="voice-meta" id="voiceMeta">女声 · 25岁 · 中文普通话</div>
                            </div>
                            <span class="voice-badge">推荐</span>
                        </div>

                        <div class="section-divider"></div>

                        <section class="original-text-section">
                            <h2 class="section-title">原文</h2>
                            <div class="original-text">
                                <p class="original-text-content" id="originalTextContent">欢迎使用我们的 AI 文字转语音工具。</p>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Row More Menu -->
    <div class="row-more-menu" id="rowMoreMenu">
        <div class="row-menu-item" id="menuBatchSelect">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><polyline points="9 11 12 14 22 4"/></svg>
            <span>批量操作</span>
        </div>
        <div class="row-menu-divider"></div>
        <div class="row-menu-item" id="menuEditName">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            <span>编辑名称</span>
        </div>
        <div class="row-menu-item" id="menuExport">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>导出</span>
        </div>
        <div class="row-menu-divider"></div>
        <div class="row-menu-item danger" id="menuDelete">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            <span>删除</span>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">编辑音频名称</span>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" class="modal-input" id="editInput" placeholder="输入新的音频名称">
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" id="modalCancel">取消</button>
                <button class="modal-btn confirm" id="modalConfirm">保存</button>
            </div>
        </div>
    </div>

    <script>
        let audioData = [
            { id: 1, name: '产品介绍', voice: '晓晓', voiceChar: '晓', duration: '03:48', durationSec: 228, cost: 76, voiceType: '中文女声', voiceAge: '25岁', language: '中文普通话', text: '欢迎使用我们的 AI 文字转语音工具。这个全新的语音合成系统能够将您输入的文字快速转换为自然流畅的语音。' },
            { id: 2, name: '播客开场白', voice: '小宇', voiceChar: '宇', duration: '01:23', durationSec: 83, cost: 28, voiceType: '中文男声', voiceAge: '30岁', language: '中文普通话', text: '大家好，欢迎收听本期播客。今天我们来聊一聊人工智能的最新发展趋势。' },
            { id: 3, name: '有声书·第一章', voice: '安然', voiceChar: '安', duration: '05:12', durationSec: 312, cost: 102, voiceType: '中文女声', voiceAge: '28岁', language: '中文普通话', text: '清晨的阳光透过窗帘洒进房间，新的一天开始了。这是一个关于成长和梦想的故事。' },
            { id: 4, name: '广告配音', voice: '小雅', voiceChar: '雅', duration: '00:45', durationSec: 45, cost: 18, voiceType: '中文女声', voiceAge: '25岁', language: '中文普通话', text: '限时优惠，现在购买享受八折优惠。品质保证，售后无忧。' },
            { id: 5, name: '新闻播报', voice: '明远', voiceChar: '明', duration: '02:34', durationSec: 154, cost: 52, voiceType: '中文男声', voiceAge: '35岁', language: '中文普通话', text: '今日要闻：科技行业迎来新一轮创新浪潮，多项突破性技术相继发布。' },
            { id: 6, name: '儿童故事', voice: '甜甜', voiceChar: '甜', duration: '04:15', durationSec: 255, cost: 88, voiceType: '中文女声', voiceAge: '儿童', language: '中文普通话', text: '小兔子和小熊是好朋友，它们一起在森林里探险，寻找神奇的宝藏。' }
        ];

        let selectedId = null;
        let isPlaying = false;
        let currentTime = 0;
        let playbackSpeed = 1;
        let currentAudio = null;
        let isMultiSelectMode = false;
        let selectedIds = new Set();
        let editTargetId = null;
        let activeMoreMenuId = null;

        const audioList = document.getElementById('audioList');
        const rowMoreMenu = document.getElementById('rowMoreMenu');
        const selectionBar = document.getElementById('selectionBar');
        const editModal = document.getElementById('editModal');
        const editInput = document.getElementById('editInput');

        function renderAudioList() {
            audioList.innerHTML = audioData.map(audio => `
                <div class="audio-item ${audio.id === selectedId && !isMultiSelectMode ? 'selected' : ''} ${audio.id === selectedId && isPlaying ? 'playing' : ''} ${isMultiSelectMode ? 'in-multiselect' : ''}" data-id="${audio.id}">
                    <div class="audio-checkbox ${selectedIds.has(audio.id) ? 'checked' : ''}" data-checkbox="${audio.id}">
                        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <div class="audio-item-avatar">${audio.voiceChar}</div>
                    <div class="audio-item-info">
                        <div class="audio-item-name">${audio.name}</div>
                        <div class="audio-item-meta">
                            <span>${audio.voice}</span>
                            <span>·</span>
                            <span>${audio.duration}</span>
                        </div>
                    </div>
                    <button class="more-btn" data-more="${audio.id}" title="更多">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                    </button>
                </div>
            `).join('');

            document.getElementById('listCount').textContent = `${audioData.length} 个`;

            audioList.querySelectorAll('.audio-item').forEach(item => {
                const id = parseInt(item.dataset.id);

                item.querySelector('.audio-checkbox').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!isMultiSelectMode) enterMultiSelectMode();
                    toggleSelection(id);
                });

                item.querySelector('[data-more]').addEventListener('click', (e) => {
                    e.stopPropagation();
                    showRowMenu(id, e.currentTarget);
                });

                item.addEventListener('click', () => {
                    if (isMultiSelectMode) {
                        toggleSelection(id);
                    } else {
                        selectAudio(id);
                    }
                });
            });
        }

        function showRowMenu(id, anchorEl) {
            activeMoreMenuId = id;
            const rect = anchorEl.getBoundingClientRect();
            const menuWidth = 160;
            const panel = document.querySelector('.audio-list-panel').getBoundingClientRect();

            let left = rect.left - panel.left - menuWidth - 4;
            if (left < 12) left = rect.left - panel.left + 28;

            rowMoreMenu.style.left = `${left}px`;
            rowMoreMenu.style.top = `${rect.top - panel.top}px`;
            rowMoreMenu.classList.add('visible');
        }

        function closeRowMenu() {
            rowMoreMenu.classList.remove('visible');
            activeMoreMenuId = null;
        }

        document.addEventListener('click', (e) => {
            if (!rowMoreMenu.contains(e.target) && !e.target.closest('.more-btn')) {
                closeRowMenu();
            }
        });

        document.getElementById('menuEditName').addEventListener('click', () => {
            if (activeMoreMenuId) {
                closeRowMenu();
                editTargetId = activeMoreMenuId;
                const audio = audioData.find(a => a.id === activeMoreMenuId);
                editInput.value = audio.name;
                editModal.classList.add('visible');
                editInput.focus();
                editInput.select();
            }
        });

        document.getElementById('menuBatchSelect').addEventListener('click', () => {
            if (activeMoreMenuId) {
                if (!isMultiSelectMode) {
                    enterMultiSelectMode();
                }
                selectedIds.add(activeMoreMenuId);
                updateSelectionUI();
                closeRowMenu();
            }
        });

        document.getElementById('menuExport').addEventListener('click', () => {
            if (activeMoreMenuId) {
                const audio = audioData.find(a => a.id === activeMoreMenuId);
                showToast(`正在导出 "${audio.name}"...`);
                closeRowMenu();
            }
        });

        document.getElementById('menuDelete').addEventListener('click', () => {
            if (activeMoreMenuId) {
                audioData = audioData.filter(a => a.id !== activeMoreMenuId);
                if (selectedId === activeMoreMenuId) {
                    selectedId = null;
                    currentAudio = null;
                    updatePlayerUI();
                }
                showToast('已删除音频');
                closeRowMenu();
                renderAudioList();
            }
        });

        function toggleSelection(id) {
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
            } else {
                selectedIds.add(id);
            }
            updateSelectionUI();
        }

        function updateSelectionUI() {
            document.getElementById('selectionCountBadge').textContent = selectedIds.size;
            renderAudioList();
            if (isMultiSelectMode) {
                selectionBar.classList.add('visible');
            } else {
                selectionBar.classList.remove('visible');
            }
        }

        function enterMultiSelectMode() {
            isMultiSelectMode = true;
            selectionBar.classList.add('visible');
            renderAudioList();
        }

        function exitMultiSelectMode() {
            isMultiSelectMode = false;
            selectedIds.clear();
            selectionBar.classList.remove('visible');
            renderAudioList();
        }

        document.getElementById('selectAllBtn').addEventListener('click', () => {
            selectedIds = new Set(audioData.map(a => a.id));
            updateSelectionUI();
        });

        document.getElementById('deselectBtn').addEventListener('click', exitMultiSelectMode);

        document.getElementById('deleteSelectedBtn').addEventListener('click', () => {
            if (selectedIds.size > 0) {
                audioData = audioData.filter(a => !selectedIds.has(a.id));
                if (selectedId && selectedIds.has(selectedId)) {
                    selectedId = null;
                    currentAudio = null;
                    updatePlayerUI();
                }
                showToast(`已删除 ${selectedIds.size} 个音频`);
                exitMultiSelectMode();
            }
        });

        document.getElementById('exportSelectedBtn').addEventListener('click', () => {
            if (selectedIds.size > 0) {
                showToast(`正在导出 ${selectedIds.size} 个音频...`);
            }
        });

        document.getElementById('modalClose').addEventListener('click', closeEditModal);
        document.getElementById('modalCancel').addEventListener('click', closeEditModal);

        document.getElementById('modalConfirm').addEventListener('click', () => {
            const newName = editInput.value.trim();
            if (newName && editTargetId) {
                const audio = audioData.find(a => a.id === editTargetId);
                if (audio) {
                    audio.name = newName;
                    if (selectedId === editTargetId) updatePlayerUI();
                    renderAudioList();
                    showToast('名称已更新');
                }
            }
            closeEditModal();
        });

        editModal.addEventListener('click', (e) => {
            if (e.target === editModal) closeEditModal();
        });

        function closeEditModal() {
            editModal.classList.remove('visible');
            editTargetId = null;
        }

        function selectAudio(id) {
            selectedId = id;
            currentAudio = audioData.find(a => a.id === id);
            renderAudioList();
            updatePlayerUI();
        }

        function updatePlayerUI() {
            const empty = document.getElementById('playerEmpty');
            const content = document.getElementById('playerContent');

            if (!currentAudio) {
                empty.style.display = 'flex';
                content.style.display = 'none';
                return;
            }

            empty.style.display = 'none';
            content.style.display = 'flex';

            document.getElementById('playerTitle').textContent = currentAudio.name;
            document.getElementById('audioTitle').textContent = currentAudio.name;
            document.getElementById('audioVoice').textContent = `${currentAudio.voiceType} · ${currentAudio.voice}`;
            document.getElementById('audioDuration').textContent = currentAudio.duration;
            document.getElementById('audioCost').textContent = `${currentAudio.cost} 积分`;
            document.getElementById('totalTimeDisplay').textContent = currentAudio.duration;
            document.getElementById('voiceAvatar').textContent = currentAudio.voiceChar;
            document.getElementById('voiceName').textContent = `${currentAudio.voice} · 旗舰音色`;
            document.getElementById('voiceMeta').textContent = `${currentAudio.voiceType} · ${currentAudio.voiceAge} · ${currentAudio.language}`;
            document.getElementById('originalTextContent').textContent = currentAudio.text;

            generateWaveform();
            updateProgress();
        }

        function generateWaveform() {
            const waveform = document.getElementById('waveform');
            waveform.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                const bar = document.createElement('div');
                bar.className = 'waveform-bar';
                bar.style.height = `${Math.sin(i * 0.2) * 15 + Math.random() * 12 + 8}px`;
                waveform.appendChild(bar);
            }
        }

        function updateProgress() {
            if (!currentAudio) return;
            const progress = currentTime / currentAudio.durationSec;
            const bars = document.querySelectorAll('.waveform-bar');
            bars.forEach((bar, i) => {
                bar.classList.toggle('played', i < Math.floor(progress * bars.length));
            });
            document.getElementById('progressIndicator').style.left = `${progress * 100}%`;
            document.getElementById('currentTimeDisplay').textContent = formatTime(currentTime);
        }

        function formatTime(seconds) {
            return `${Math.floor(seconds / 60).toString().padStart(2, '0')}:${Math.floor(seconds % 60).toString().padStart(2, '0')}`;
        }

        function startPlayback() {
            if (isPlaying && currentAudio) {
                currentTime += 0.1 * playbackSpeed;
                if (currentTime >= currentAudio.durationSec) {
                    currentTime = 0;
                    isPlaying = false;
                    renderAudioList();
                    updatePlayButton();
                    return;
                }
                updateProgress();
                requestAnimationFrame(() => setTimeout(startPlayback, 100));
            }
        }

        function skip(seconds) {
            if (!currentAudio) return;
            currentTime = Math.max(0, Math.min(currentAudio.durationSec, currentTime + seconds));
            updateProgress();
        }

        function updatePlayButton() {
            document.getElementById('playIcon').style.display = isPlaying ? 'none' : 'block';
            document.getElementById('pauseIcon').style.display = isPlaying ? 'block' : 'none';
        }

        document.getElementById('playBtn').addEventListener('click', () => {
            if (!currentAudio) return;
            isPlaying = !isPlaying;
            updatePlayButton();
            renderAudioList();
            if (isPlaying) startPlayback();
        });

        document.getElementById('skipBackBtn').addEventListener('click', () => skip(-15));
        document.getElementById('skipBack5Btn').addEventListener('click', () => skip(-5));
        document.getElementById('skipForward5Btn').addEventListener('click', () => skip(5));
        document.getElementById('skipForwardBtn').addEventListener('click', () => skip(15));

        const speedMenu = document.getElementById('speedMenu');
        document.getElementById('speedBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            speedMenu.classList.toggle('open');
        });

        document.querySelectorAll('.speed-option').forEach(option => {
            option.addEventListener('click', () => {
                playbackSpeed = parseFloat(option.dataset.speed);
                document.getElementById('currentSpeed').textContent = `${playbackSpeed}×`;
                document.querySelectorAll('.speed-option').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
                speedMenu.classList.remove('open');
            });
        });

        document.addEventListener('click', () => speedMenu.classList.remove('open'));

        document.getElementById('waveformContainer').addEventListener('click', (e) => {
            if (!currentAudio) return;
            const rect = e.currentTarget.getBoundingClientRect();
            currentTime = ((e.clientX - rect.left) / rect.width) * currentAudio.durationSec;
            updateProgress();
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space') {
                e.preventDefault();
                if (currentAudio) {
                    isPlaying = !isPlaying;
                    updatePlayButton();
                    renderAudioList();
                    if (isPlaying) startPlayback();
                }
            }
            if (e.code === 'Escape') {
                if (isMultiSelectMode) exitMultiSelectMode();
                closeEditModal();
                closeRowMenu();
            }
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            if (currentAudio) showToast(`正在导出 "${currentAudio.name}"...`);
        });
        document.getElementById('copyNameBtn').addEventListener('click', () => {
            if (currentAudio) {
                navigator.clipboard.writeText(currentAudio.name);
                showToast('已复制音频名称');
            }
        });
        document.getElementById('favoriteBtn').addEventListener('click', () => showToast('已添加到收藏'));
        document.getElementById('shareBtn').addEventListener('click', () => showToast('显示分享选项...'));

        function showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 200);
            }, 2000);
        }

        renderAudioList();
    </script>
</body>
</html>
